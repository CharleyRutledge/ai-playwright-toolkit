name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
        browser: [chromium, firefox, webkit]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install ${{ matrix.browser }} --with-deps
      
      - name: Run Playwright tests
        run: |
          pytest tests/ --browser ${{ matrix.browser }} -v --alluredir=allure-results
        env:
          BASE_URL: https://playwright.dev
          BROWSER: ${{ matrix.browser }}
          HEADLESS: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}-${{ matrix.browser }}
          path: |
            test-results/
            allure-results/
          retention-days: 30
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.python-version }}-${{ matrix.browser }}
          path: test-results/screenshot_*.png
          retention-days: 30
      
      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report
      
      - name: Deploy Allure Report to GitHub Pages
        if: always() && matrix.python-version == '3.11' && matrix.browser == 'chromium' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy
      
      - name: Run Black
        run: |
          black --check page_objects/ utils/ fixtures/ tests/
      
      - name: Run Flake8
        run: |
          flake8 page_objects/ utils/ fixtures/ tests/ --max-line-length=100 --extend-ignore=E203,W503
      
      - name: Run MyPy
        run: |
          mypy page_objects/ utils/ fixtures/ || true

  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
      
      - name: Run Safety check
        run: |
          safety check --file requirements.txt || true
      
      - name: Run Bandit security check
        run: |
          bandit -r page_objects/ utils/ fixtures/ tests/ || true
